name: Build Reynard

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build
        required: true
        type: string
      nightly:
        description: Build nightly version
        required: false
        default: false
        type: boolean
      build_normal_ipa:
        description: Build normal IPA
        required: false
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        required: false
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        required: false
        default: true
        type: boolean
      fast_build:
        description: Disable optimization and LTO for validation builds
        required: false
        default: false
        type: boolean
      build_simulator:
        description: Build an arm64 iOS Simulator app
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.repository_owner == 'minh-ton' || github.repository_owner == 'limalivy' }}
    name: Select build variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_build: ${{ steps.matrix.outputs.should_build }}
    steps:
      - name: Select matrix
        id: matrix
        uses: actions/github-script@v9
        env:
          BUILD_NORMAL_IPA: ${{ inputs.build_normal_ipa }}
          BUILD_TROLLSTORE_TIPA: ${{ inputs.build_trollstore_tipa }}
          BUILD_JAILBROKEN_IPA: ${{ inputs.build_jailbroken_ipa }}
          BUILD_SIMULATOR: ${{ inputs.build_simulator }}
        with:
          script: |
            const variants = [];

            if (
              process.env.BUILD_NORMAL_IPA === 'true' ||
              process.env.BUILD_TROLLSTORE_TIPA === 'true'
            ) {
              variants.push({
                variant: 'standard',
                build_args: '--use-sccache --auto-clobber',
                sccache_namespace: 'standard',
              });
            }

            if (
              process.env.BUILD_JAILBROKEN_IPA === 'true'
            ) {
              variants.push({
                variant: 'nojemalloc',
                build_args: '--disable-jemalloc --use-sccache --auto-clobber',
                sccache_namespace: 'nojemalloc',
              });
            }

            if (process.env.BUILD_SIMULATOR === 'true') {
              variants.push({
                variant: 'simulator',
                build_args: '--simulator --use-sccache --auto-clobber',
                sccache_namespace: 'simulator',
              });
            }

            core.setOutput('matrix', JSON.stringify({ include: variants }));
            core.setOutput('should_build', String(variants.length > 0));

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: "${{ matrix.variant == 'simulator' && 'Build Simulator' || (matrix.variant == 'standard' && 'Build Standard / TrollStore' || 'Build Jailbroken') }}"
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ matrix.sccache_namespace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          submodules: false

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.variant == 'simulator' && 'aarch64-apple-ios-sim' || 'aarch64-apple-ios' }}

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            buildcache-gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore media library cache
        uses: actions/cache@v4
        with:
          path: |
            support/media/archives
            support/media/source
            support/media/build
          key: media-xcode26.6-${{ matrix.variant }}-${{ hashFiles('tools/development/build-media.sh') }}

      - name: Build and test video components
        run: |
          sh tools/development/build-media.sh ${{ matrix.variant == 'simulator' && '--simulator' || '' }}
          swiftc browser/Reynard/Client/Stores/HLSPlaylist.swift tools/tests/HLSPlaylistTests.swift -o "$RUNNER_TEMP/hls-tests"
          "$RUNNER_TEMP/hls-tests"

      - name: Build Gecko
        id: gecko
        shell: bash
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh ${{ matrix.build_args }} ${{ inputs.fast_build && '--fast-build' || '' }} 2>&1 | tee "$RUNNER_TEMP/gecko-build.log"

      - name: Report Gecko build errors
        if: ${{ failure() && steps.gecko.outcome == 'failure' }}
        shell: python
        run: |
          import os
          from pathlib import Path

          log = Path(os.environ['RUNNER_TEMP']) / 'gecko-build.log'
          errors = [line for line in log.read_text(errors='replace').splitlines() if 'error:' in line.lower()]
          for line in errors[-10:]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Gecko build::{escaped}')

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh ${{ matrix.variant == 'simulator' && '--simulator' || '' }}

      - name: Install packaging dependencies
        if: ${{ matrix.variant != 'simulator' }}
        run: brew install ldid

      - name: Build app
        if: ${{ matrix.variant != 'simulator' }}
        run: ./tools/release/build-app.sh --no-signing ${{ inputs.nightly && '--nightly' || '' }}

      - name: Build simulator app
        id: simulator_app
        if: ${{ matrix.variant == 'simulator' }}
        shell: bash
        run: ./tools/development/build-simulator.sh 2>&1 | tee "$RUNNER_TEMP/simulator-build.log"

      - name: Report simulator app build errors
        if: ${{ failure() && steps.simulator_app.outcome == 'failure' }}
        shell: python
        run: |
          import os
          from pathlib import Path

          log = Path(os.environ['RUNNER_TEMP']) / 'simulator-build.log'
          errors = [line for line in log.read_text(errors='replace').splitlines() if 'error:' in line.lower()]
          for line in errors[-10:]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Simulator app build::{escaped}')

      - name: Upload simulator app
        if: ${{ matrix.variant == 'simulator' }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Simulator
          path: dist/Reynard-Simulator.zip
          if-no-files-found: error

      - name: Create IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        run: ./tools/release/create-ipa.sh

      - name: Create TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Create Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        run: ./tools/release/create-ipa.sh --jailbroken

      - name: Upload IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard.ipa
          path: dist/Reynard.ipa
          if-no-files-found: error

      - name: Upload TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore.tipa
          path: dist/Reynard-TrollStore.tipa
          if-no-files-found: error

      - name: Upload Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken.ipa
          path: dist/Reynard-Jailbroken.ipa
          if-no-files-found: error
